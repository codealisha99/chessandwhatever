# Full cluster locally: Postgres + Redis + two app instances behind Caddy (round-robin, WebSockets included).
# Production runs the same server on Railway with Neon Postgres — see README.
#   AUTH_SECRET=$(openssl rand -hex 32) docker compose up --build
#   open http://localhost:8080
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: gambit, POSTGRES_PASSWORD: gambit, POSTGRES_DB: gambit }
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gambit"]
      interval: 5s
      retries: 10

  app:
    build: .
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://gambit:gambit@postgres:5432/gambit
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET, e.g. AUTH_SECRET=$(openssl rand -hex 32)}
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    deploy:
      replicas: 2
    stop_grace_period: 10s

  lb:
    image: caddy:2-alpine
    ports: ["8080:80"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on: [app]

volumes:
  redis:
  pg:
