name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - run: npm ci && npm --prefix backend1 ci && npm --prefix frontend ci
      - run: npm run typecheck
      - run: npm test
      # builds the SPA, builds + pushes the container image (Docker is preinstalled on the runner), deploys the Worker
      - name: Deploy to Cloudflare
        id: deploy
        run: |
          set -o pipefail
          npm run deploy 2>&1 | tee deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Report deploy status
        if: always()
        run: |
          echo "### Deploy Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f deploy.log ]; then cat deploy.log >> $GITHUB_STEP_SUMMARY; else echo "No deploy.log found"; fi
          echo '```' >> $GITHUB_STEP_SUMMARY
